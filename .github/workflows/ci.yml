name: CI

# Runs on Linux: macOS minutes are billed at 10x on private repos, and these
# checks don't need a Mac (release.yml still builds the real macOS installers).
# site/** is skipped: the website has its own Vercel preview on every PR.
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['site/**']
  pull_request:
    branches: [main, 'release/**']
    paths-ignore: ['site/**']
    # Draft PRs run nothing; CI starts when you click "Ready for review".
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the older run instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links

  build:
    name: Build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Build exercises the native node-pty rebuild (Linux here; release.yml covers
    # macOS and Windows). Allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  licensing:
    name: Licensing service
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/licensing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/licensing/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (real SQL on PGlite, fake Stripe + IdPs)
        run: npm test
