name: Build blog

# Checks that the built blog in docs/blog matches its source in blog/. The site
# itself is served by the existing GitHub Pages "deploy from branch" setup
# (docs/ + CNAME), so whatever docs/blog holds on main is what is live.
#
# This workflow used to rebuild after a merge and push the output to main. main
# requires status checks, and a push from Actions cannot satisfy them, so that
# push was rejected (GH006) and new posts never went live. The build now ships
# inside the pull request: run `cd blog && npm ci && npm run build` and commit
# docs/blog and docs/sitemap.xml together with the source change. This job
# rebuilds from scratch and fails when the committed output differs. Two builds
# of the same tree produce identical files, so a failure means stale output.
#
# On push to main it runs the same check, so a merge that leaves the live blog
# stale shows up as a red run instead of passing silently. It never pushes.

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/**"
      - "docs/blog/**"
      - "docs/sitemap.xml"
      - ".github/workflows/blog.yml"
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "docs/blog/**"
      - "docs/sitemap.xml"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Named so it can never be mistaken for CI's required "Build" check.
    name: Built blog is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install + build blog
        working-directory: blog
        run: |
          npm ci
          npm run build

      - name: Committed output matches the build
        run: |
          # docs/blog = the built site; docs/sitemap.xml = root sitemap the
          # build regenerates (owned by this build, per the Kevin handoff).
          if [ -n "$(git status --porcelain docs/blog docs/sitemap.xml)" ]; then
            git status --short docs/blog docs/sitemap.xml | head -50
            echo "::error title=Built blog is out of date::Run 'cd blog && npm ci && npm run build' and commit docs/blog and docs/sitemap.xml in this pull request."
            exit 1
          fi
          echo "docs/blog matches a fresh build."
