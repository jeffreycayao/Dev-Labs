name: App version

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Version increases on every source push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node tools/app-version.cjs check "$PR_BASE" HEAD
          else
            node tools/app-version.cjs check "$PUSH_BASE" HEAD
          fi
