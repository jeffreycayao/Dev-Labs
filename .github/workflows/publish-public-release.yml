name: Publish public release mirror

# release.published covers releases created by a person or an external token.
# release.yml also calls this workflow after publishing with GITHUB_TOKEN,
# whose release event cannot start another Actions run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private release tag to mirror
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Private release tag to mirror
        required: true
        type: string
    secrets:
      PUBLIC_REPO_PAT:
        required: true

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.repository }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'jeffreycayao/Dev-Labs'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PUBLIC_REPO: jeffreycayao/ATMT_LABS_FLOOR-releases
    steps:
      - name: Check out private release workflow
        uses: actions/checkout@v4

      - name: Read private release and download every asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/source-release.json"
          jq -e --arg tag "$TAG" '(.tag_name == $tag) and (.draft == false)' "$RUNNER_TEMP/source-release.json" > /dev/null
          jq -j '.body // ""' "$RUNNER_TEMP/source-release.json" > "$RUNNER_TEMP/release-notes.md"

          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$asset_dir"
          expected=$(jq '.assets | length' "$RUNNER_TEMP/source-release.json")
          actual=$(find "$asset_dir" -maxdepth 1 -type f | wc -l)
          if [ "$expected" -eq 0 ] || [ "$expected" -ne "$actual" ]; then
            echo "Private release assets missing: expected $expected, downloaded $actual" >&2
            exit 1
          fi
          while IFS=$'\t' read -r name size digest; do
            file="$asset_dir/$name"
            test -f "$file"
            test "$(stat -c %s "$file")" -eq "$size"
            if [[ "$digest" == sha256:* ]]; then
              test "$(sha256sum "$file" | cut -d ' ' -f 1)" = "${digest#sha256:}"
            fi
          done < <(jq -r '.assets[] | [.name, .size, (.digest // "")] | @tsv' "$RUNNER_TEMP/source-release.json")

      - name: Create matching public release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          gh api "repos/$PUBLIC_REPO" --jq '.full_name' > /dev/null
          if gh api "repos/$PUBLIC_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/public-release.json" 2>/dev/null; then
            echo "Public release already exists; checking exact metadata and asset sizes."
          else
            title=$(jq -r '.name // ""' "$RUNNER_TEMP/source-release.json")
            prerelease=()
            if jq -e '.prerelease' "$RUNNER_TEMP/source-release.json" > /dev/null; then
              prerelease+=(--prerelease)
            fi
            mapfile -d '' assets < <(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -print0 | sort -z)
            gh release create "$TAG" "${assets[@]}" --repo "$PUBLIC_REPO" \
              --target main --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
            gh api "repos/$PUBLIC_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/public-release.json"
          fi

          # Exact tag, title, body, prerelease flag, names and byte sizes.
          # An existing release with different assets fails rather than silently
          # deleting or replacing files downloaded by installed clients.
          jq -S -c '{tag_name,name,body,prerelease,assets:(.assets | map({name,size}) | sort_by(.name))}' \
            "$RUNNER_TEMP/source-release.json" > "$RUNNER_TEMP/source-summary.json"
          jq -S -c '{tag_name,name,body,prerelease,assets:(.assets | map({name,size}) | sort_by(.name))}' \
            "$RUNNER_TEMP/public-release.json" > "$RUNNER_TEMP/public-summary.json"
          diff -u "$RUNNER_TEMP/source-summary.json" "$RUNNER_TEMP/public-summary.json"
          echo "Public release $TAG mirrors the private release."
