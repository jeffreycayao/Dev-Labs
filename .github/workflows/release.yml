name: Release

# Build installers for every platform and publish them to a GitHub Release
# whenever a v* tag is pushed. Run manually (workflow_dispatch) to dry-build
# without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare private draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft for a tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/render-release-body.cjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-body.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json" > /dev/null
            echo "Reusing an existing private draft release."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-body.md"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (used to rebuild native node-pty) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 and install setuptools so the distutils
      # shim is available across all runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Compile (electron-vite → out/)
        run: npm run build
        env:
          # Anonymous product analytics (TELEMETRY.md). The PostHog project key
          # is public/write-only, but only official release builds inject it —
          # forks without the secret compile with '' and analytics no-ops.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Package installers
        # --publish never builds updater metadata without uploading anywhere.
        # No GitHub credential is present while the client binary is packaged.
        shell: bash
        run: |
          # An empty CSC_LINK is interpreted by electron-builder as a path to
          # the checkout. Remove unset signing inputs for unsigned builds.
          if [[ -z "${CSC_LINK:-}" ]]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [[ -z "${APPLE_ID:-}" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          # macOS code signing + notarization — MUST be macOS-only. CSC_LINK is the
          # Apple Developer ID .p12; if it leaks into the Windows/Linux runners,
          # electron-builder tries to sign those targets with the mac cert and the
          # build hard-fails ("cannot extract publisher name"). So gate on the OS.
          #   APPLE_CERTIFICATE_P12       = base64 of the "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD  = that .p12's export password (REQUIRED if P12 set,
          #                                 else electron-builder imports with an empty
          #                                 password and fails "MAC verification failed")
          # All optional: with the secrets unset every runner builds unsigned and stays green.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # hash only the distributable artifacts, not blockmaps/yml
          files=$(ls *.dmg *.zip *.exe *.AppImage 2>/dev/null || true)
          [ -z "$files" ] && { echo "no artifacts to hash"; exit 0; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.os }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Upload assets to private draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage
                 dist/*.blockmap dist/latest*.yml dist/SHA256SUMS-*.txt)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets were built." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check updater channels and publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The REST release-by-tag endpoint can return 404 for drafts; the
          # CLI's release view resolves them for repository writers.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,assets > "$RUNNER_TEMP/private-release.json"
          jq -e '.isDraft == true' "$RUNNER_TEMP/private-release.json" > /dev/null
          jq -e '[.assets[].name] as $assets |
            all(["latest.yml", "latest-mac.yml", "latest-linux.yml"][];
              . as $name | ($assets | index($name)) != null)' \
            "$RUNNER_TEMP/private-release.json" > /dev/null
          id=$(jq -r '.databaseId' "$RUNNER_TEMP/private-release.json")
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -F "prerelease=$prerelease" --silent
          echo "Published private release $GITHUB_REF_NAME with all updater channels."

  mirror:
    name: Mirror to public releases
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    # The publish job creates the private release with GITHUB_TOKEN. GitHub does
    # not fire another workflow's release event for that action, so call the
    # mirror directly as part of this run. Manually published releases also
    # reach the mirror through its release.published trigger.
    uses: ./.github/workflows/publish-public-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
